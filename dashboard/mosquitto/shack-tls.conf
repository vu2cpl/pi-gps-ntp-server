# /etc/mosquitto/conf.d/shack-tls.conf — reference broker config: every
# client authenticates, LAN traffic is TLS-only. See dashboard/README.md
# "Broker with TLS". Remove `listener` / `allow_anonymous` lines from the
# main mosquitto.conf so this file is the only place they are set.
per_listener_settings false
allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/acl

# Publisher on the broker's own Pi: plain MQTT, loopback only
# (cron env MQTT_BROKER=127.0.0.1). Drop this listener if the broker
# runs elsewhere.
listener 1883 127.0.0.1

# LAN clients (SwiftBar plugin, Node-RED, a remote publisher): TLS only.
listener 8883
cafile /etc/mosquitto/certs/ca.crt
certfile /etc/mosquitto/certs/server.crt
keyfile /etc/mosquitto/certs/server.key
tls_version tlsv1.2
